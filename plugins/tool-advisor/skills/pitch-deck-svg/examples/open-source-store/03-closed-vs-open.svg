<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 560" width="1000" height="560">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&amp;family=Funnel+Display:wght@300..800&amp;display=swap');
    text{font-family:'Bricolage Grotesque','Inter',system-ui,sans-serif;}
    .disp{font-family:'Funnel Display','Bricolage Grotesque',sans-serif;font-weight:800;}
  </style>
  <defs>
    <radialGradient id="vig3" cx="72%" cy="40%" r="80%">
      <stop offset="0" stop-color="hsl(30 12% 11%)"/><stop offset="1" stop-color="hsl(0 0% 4%)"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="hsl(196 57% 44% / .20)"/><stop offset="1" stop-color="hsl(196 57% 44% / 0)"/>
    </radialGradient>
    <filter id="soft3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1000" height="560" fill="url(#vig3)"/>
  <text x="500" y="80" text-anchor="middle" font-size="14" font-weight="600" letter-spacing="4" fill="hsl(18 67% 50%)">WHY WE PRINT IT</text>
  <text x="500" y="140" text-anchor="middle" class="disp" font-size="48" letter-spacing="-1.2" fill="hsl(38 75% 97%)">CLOSED IS A CAGE. <tspan fill="hsl(196 52% 56%)">OPEN IS A MOVEMENT.</tspan></text>

  <!-- LEFT: the closed box (dim) -->
  <g opacity=".85">
    <rect x="120" y="220" width="230" height="190" rx="10" fill="hsl(0 0% 7%)" stroke="hsl(33 9% 30%)" stroke-width="2" filter="url(#soft3)"/>
    <!-- lock -->
    <g transform="translate(235,300)" stroke="hsl(33 9% 46%)" stroke-width="4" fill="none" stroke-linecap="round">
      <rect x="-26" y="-6" width="52" height="42" rx="6" fill="hsl(0 0% 5%)"/>
      <path d="M-15 -6 v-14 a15 15 0 0 1 30 0 v14"/>
    </g>
    <text x="235" y="386" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="3" fill="hsl(33 9% 46%)">SEALED&#160;·&#160;RENTED&#160;·&#160;THEIRS</text>
  </g>
  <text x="235" y="452" text-anchor="middle" font-size="17" font-weight="700" fill="hsl(35 12% 64%)">CLOSED SOURCE</text>

  <!-- arrow of migration -->
  <g stroke="hsl(18 67% 50%)" stroke-width="4" fill="hsl(18 67% 50%)" stroke-linecap="round">
    <line x1="400" y1="312" x2="486" y2="312"/>
    <polygon points="498,312 482,304 482,320"/>
  </g>

  <!-- RIGHT: the open network (lit) -->
  <ellipse cx="720" cy="310" rx="240" ry="170" fill="url(#glow3)"/>
  <g fill="none" stroke="hsl(196 57% 44% / .75)" stroke-width="2.6">
    <line x1="620" y1="250" x2="720" y2="310"/><line x1="820" y1="250" x2="720" y2="310"/>
    <line x1="590" y1="360" x2="720" y2="310"/><line x1="850" y1="360" x2="720" y2="310"/>
    <line x1="720" y1="200" x2="720" y2="310"/><line x1="670" y1="416" x2="720" y2="310"/>
    <line x1="778" y1="416" x2="720" y2="310"/>
    <line x1="620" y1="250" x2="720" y2="200"/><line x1="820" y1="250" x2="720" y2="200"/>
    <line x1="590" y1="360" x2="670" y2="416"/><line x1="850" y1="360" x2="778" y2="416"/>
  </g>
  <!-- nodes -->
  <g stroke-width="3">
    <circle cx="720" cy="310" r="26" fill="hsl(30 9% 12.5%)" stroke="hsl(38 72% 78%)" filter="url(#soft3)"/>
    <circle cx="720" cy="200" r="13" fill="hsl(0 0% 4%)" stroke="hsl(196 52% 56%)"/>
    <circle cx="620" cy="250" r="13" fill="hsl(0 0% 4%)" stroke="hsl(20 75% 62%)"/>
    <circle cx="820" cy="250" r="13" fill="hsl(0 0% 4%)" stroke="hsl(196 52% 56%)"/>
    <circle cx="590" cy="360" r="13" fill="hsl(0 0% 4%)" stroke="hsl(38 72% 78%)"/>
    <circle cx="850" cy="360" r="13" fill="hsl(0 0% 4%)" stroke="hsl(20 75% 62%)"/>
    <circle cx="670" cy="416" r="13" fill="hsl(0 0% 4%)" stroke="hsl(196 52% 56%)"/>
    <circle cx="778" cy="416" r="13" fill="hsl(0 0% 4%)" stroke="hsl(38 72% 78%)"/>
  </g>
  <!-- heart of the hub: star -->
  <path d="M720,296 L724.4,305.6 735,306.9 727,314.2 729.4,325 720,319.5 710.6,325 713,314.2 705,306.9 715.6,305.6 Z" fill="hsl(38 72% 78%)"/>
  <text x="720" y="470" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="3" fill="hsl(196 52% 56%)">FORKED&#160;·&#160;SHARED&#160;·&#160;OURS</text>
  <text x="720" y="502" text-anchor="middle" font-size="17" font-weight="700" fill="hsl(38 75% 97%)">OPEN SOURCE</text>

  <text x="500" y="544" text-anchor="middle" font-size="15" fill="hsl(35 12% 64%)">Every shirt is a vote for the side that shares its work.</text>
</svg>
