<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 560" width="1400" height="560">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&amp;family=Funnel+Display:wght@300..800&amp;display=swap');
    text{font-family:'Bricolage Grotesque','Inter',system-ui,sans-serif;}
    .disp{font-family:'Funnel Display','Bricolage Grotesque',sans-serif;font-weight:800;}
    .lbl{font-weight:700;fill:hsl(38 75% 97%);}
    .sub{font-weight:500;}
  </style>
  <defs>
    <radialGradient id="vig" cx="35%" cy="35%" r="80%">
      <stop offset="0" stop-color="hsl(30 12% 11%)"/><stop offset="1" stop-color="hsl(0 0% 4%)"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="hsl(18 67% 50% / .16)"/><stop offset="1" stop-color="hsl(18 67% 50% / 0)"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1400" height="560" fill="url(#vig)"/>
  <!-- left: type block -->
  <text x="90" y="150" font-size="15" font-weight="600" letter-spacing="4" fill="hsl(18 67% 50%)">THE MOVEMENT&#160;&#160;/&#160;&#160;WEAR IT</text>
  <text x="86" y="240" class="disp" font-size="88" letter-spacing="-2.5" fill="hsl(38 75% 97%)">OPEN SOURCE</text>
  <text x="86" y="330" class="disp" font-size="88" letter-spacing="-2.5" fill="hsl(18 67% 50%)">MUST WIN.</text>
  <text x="90" y="386" class="sub" font-size="23" fill="hsl(35 12% 64%)">Tees, hoodies, and caps for the people who build in the open.</text>
  <!-- pills -->
  <g font-size="14" font-weight="600">
    <rect x="90" y="418" width="150" height="36" rx="18" fill="none" stroke="hsl(38 60% 92% / .25)"/>
    <text x="165" y="441" text-anchor="middle" fill="hsl(35 12% 64%)">Print on demand</text>
    <rect x="254" y="418" width="140" height="36" rx="18" fill="none" stroke="hsl(38 60% 92% / .25)"/>
    <text x="324" y="441" text-anchor="middle" fill="hsl(35 12% 64%)">Built to be worn</text>
    <rect x="408" y="418" width="176" height="36" rx="18" fill="hsl(18 67% 50%)"/>
    <text x="496" y="441" text-anchor="middle" fill="hsl(38 75% 97%)" font-weight="700">Join the uniform</text>
  </g>
  <!-- right: git commit graph merging into a star -->
  <ellipse cx="1060" cy="280" rx="300" ry="220" fill="url(#glow)"/>
  <!-- lanes -->
  <g fill="none" stroke-width="3.4" stroke-linecap="round">
    <path d="M810 150 H 990 Q 1030 150 1050 190 L 1078 246" stroke="hsl(196 57% 44%)"/>
    <path d="M810 280 H 1040 L 1082 272" stroke="hsl(18 67% 50%)"/>
    <path d="M810 410 H 990 Q 1030 410 1050 370 L 1078 306" stroke="hsl(38 72% 78%)"/>
  </g>
  <!-- commits -->
  <g stroke-width="3">
    <circle cx="852" cy="150" r="9" fill="hsl(0 0% 4%)" stroke="hsl(196 52% 56%)"/>
    <circle cx="928" cy="150" r="9" fill="hsl(0 0% 4%)" stroke="hsl(196 52% 56%)"/>
    <circle cx="852" cy="280" r="9" fill="hsl(0 0% 4%)" stroke="hsl(20 75% 62%)"/>
    <circle cx="946" cy="280" r="9" fill="hsl(0 0% 4%)" stroke="hsl(20 75% 62%)"/>
    <circle cx="852" cy="410" r="9" fill="hsl(0 0% 4%)" stroke="hsl(38 72% 78%)"/>
    <circle cx="928" cy="410" r="9" fill="hsl(0 0% 4%)" stroke="hsl(38 72% 78%)"/>
  </g>
  <!-- merge star -->
  <circle cx="1102" cy="280" r="44" fill="hsl(30 9% 12.5%)" stroke="hsl(38 72% 78%)" stroke-width="3" filter="url(#soft)"/>
  <path d="M1102,254 L1109.5,270.5 1127,272.5 1114.5,284.5 1118,302 1102,293 1086,302 1089.5,284.5 1077,272.5 1094.5,270.5 Z" fill="hsl(38 72% 78%)"/>
  <!-- terminal window -->
  <g filter="url(#soft)">
    <rect x="880" y="440" width="420" height="86" rx="10" fill="hsl(30 9% 12.5%)" stroke="hsl(38 60% 92% / .18)"/>
    <circle cx="908" cy="464" r="5.5" fill="hsl(18 67% 50%)"/>
    <circle cx="928" cy="464" r="5.5" fill="hsl(38 72% 78%)"/>
    <circle cx="948" cy="464" r="5.5" fill="hsl(196 57% 44%)"/>
    <text x="906" y="506" font-size="19" font-family="monospace" fill="hsl(38 60% 92%)">$ git commit -m <tspan fill="hsl(20 75% 62%)">"wear the movement"</tspan></text>
  </g>
  <!-- lane labels -->
  <text x="790" y="156" text-anchor="end" class="sub" font-size="14" fill="hsl(196 52% 56%)">fork it</text>
  <text x="790" y="286" text-anchor="end" class="sub" font-size="14" fill="hsl(20 75% 62%)">build it</text>
  <text x="790" y="416" text-anchor="end" class="sub" font-size="14" fill="hsl(38 72% 78%)">share it</text>
</svg>
