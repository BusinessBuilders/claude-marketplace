<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 560" width="1000" height="560">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&amp;family=Funnel+Display:wght@300..800&amp;display=swap');
    text{font-family:'Bricolage Grotesque','Inter',system-ui,sans-serif;}
    .disp{font-family:'Funnel Display','Bricolage Grotesque',sans-serif;font-weight:800;}
  </style>
  <defs>
    <radialGradient id="vig4" cx="50%" cy="30%" r="90%">
      <stop offset="0" stop-color="hsl(30 12% 11%)"/><stop offset="1" stop-color="hsl(0 0% 4%)"/>
    </radialGradient>
    <radialGradient id="glow4" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="hsl(18 67% 50% / .14)"/><stop offset="1" stop-color="hsl(18 67% 50% / 0)"/>
    </radialGradient>
    <linearGradient id="roof4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(30 10% 18%)"/><stop offset="1" stop-color="hsl(30 10% 13%)"/></linearGradient>
    <linearGradient id="side4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="hsl(30 9% 9%)"/><stop offset="1" stop-color="hsl(30 9% 12%)"/></linearGradient>
    <filter id="soft4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <g id="w4">
      <ellipse cx="0" cy="1" rx="13" ry="3.2" fill="hsl(0 0% 0% / .4)"/>
      <rect x="-7.5" y="-15" width="6" height="16" rx="3" fill="hsl(220 6% 30%)"/>
      <rect x="1.5" y="-15" width="6" height="16" rx="3" fill="hsl(220 6% 30%)"/>
      <path d="M-13 -13 q0 -22 13 -22 q13 0 13 22 z" fill="currentColor"/>
      <circle cx="-13.5" cy="-23" r="3.4" fill="currentColor"/><circle cx="13.5" cy="-23" r="3.4" fill="currentColor"/>
      <circle cx="0" cy="-44" r="9.5" fill="hsl(38 55% 86%)"/>
      <path d="M-9.5 -46 a9.5 9.5 0 0 1 19 0 q-9.5 -7 -19 0 z" fill="hsl(28 38% 24%)"/>
    </g>
    <g id="d4">
      <rect x="-12" y="-3" width="4" height="15" rx="1.5" fill="hsl(30 10% 16%)"/><rect x="20" y="-3" width="4" height="15" rx="1.5" fill="hsl(30 10% 16%)"/>
      <rect x="-16" y="-6" width="44" height="6" rx="2" fill="hsl(30 12% 22%)"/>
      <rect x="-10" y="-23" width="26" height="17" rx="2.5" fill="hsl(30 14% 12%)" stroke="currentColor" stroke-width="1.6"/>
      <rect x="-6" y="-19" width="18" height="9" rx="1" fill="currentColor" opacity=".5"/><rect x="1" y="-6" width="4" height="6" fill="hsl(30 12% 18%)"/>
    </g>
  </defs>
  <rect width="1000" height="560" fill="url(#vig4)"/>
  <text x="500" y="78" text-anchor="middle" font-size="14" font-weight="600" letter-spacing="4" fill="hsl(18 67% 50%)">WHO'S BEHIND IT</text>
  <text x="500" y="138" text-anchor="middle" class="disp" font-size="52" letter-spacing="-1.4" fill="hsl(38 75% 97%)">BUILT BY BUILDERS, <tspan fill="hsl(38 72% 78%)">FOR BUILDERS.</tspan></text>

  <ellipse cx="500" cy="330" rx="360" ry="170" fill="url(#glow4)"/>
  <!-- workshop slab -->
  <polygon points="170,220 800,220 832,198 202,198" fill="url(#roof4)" stroke="hsl(38 60% 92% / .14)"/>
  <polygon points="800,220 832,198 832,452 800,456" fill="url(#side4)" stroke="hsl(38 60% 92% / .10)"/>
  <rect x="170" y="220" width="630" height="236" fill="hsl(30 9% 11.5%)" stroke="hsl(38 60% 92% / .16)" filter="url(#soft4)"/>
  <rect x="356" y="168" width="288" height="30" rx="15" fill="hsl(30 9% 14%)" stroke="hsl(18 67% 50% / .55)"/>
  <text x="500" y="188" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="2" fill="hsl(38 75% 97%)">THE&#160;WORKSHOP</text>

  <!-- room 1: CODE -->
  <rect x="188" y="238" width="180" height="160" rx="6" fill="hsl(196 40% 12%)" stroke="hsl(196 57% 44% / .5)"/>
  <rect x="188" y="238" width="180" height="5" rx="2.5" fill="hsl(196 57% 44%)"/>
  <text x="278" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="hsl(196 52% 56%)">CODE</text>
  <g transform="translate(306,378)"><use xlink:href="#d4" color="hsl(196 52% 60%)"/></g>
  <g transform="translate(252,378)"><use xlink:href="#w4" color="hsl(196 57% 44%)"/></g>

  <!-- room 2: HARDWARE (GPU) -->
  <rect x="384" y="238" width="180" height="160" rx="6" fill="hsl(18 35% 12%)" stroke="hsl(18 67% 50% / .5)"/>
  <rect x="384" y="238" width="180" height="5" rx="2.5" fill="hsl(18 67% 50%)"/>
  <text x="474" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="hsl(20 75% 62%)">HARDWARE</text>
  <!-- GPU card glyph -->
  <g transform="translate(444,282)">
    <rect x="0" y="0" width="60" height="64" rx="3" fill="hsl(30 11% 17%)" stroke="hsl(120 25% 50% / .85)" stroke-width="1.6"/>
    <circle cx="30" cy="22" r="10" fill="none" stroke="hsl(196 50% 58% / .8)" stroke-width="1.5"/>
    <circle cx="30" cy="46" r="7" fill="none" stroke="hsl(196 50% 58% / .8)" stroke-width="1.5"/>
    <circle cx="30" cy="22" r="2" fill="hsl(120 40% 55%)"/>
  </g>
  <g transform="translate(424,378)"><use xlink:href="#w4" color="hsl(18 67% 50%)"/></g>

  <!-- room 3: ROBOTS (robot arm) -->
  <rect x="580" y="238" width="180" height="160" rx="6" fill="hsl(38 30% 12%)" stroke="hsl(38 72% 78% / .45)"/>
  <rect x="580" y="238" width="180" height="5" rx="2.5" fill="hsl(38 72% 78%)"/>
  <text x="670" y="262" text-anchor="middle" font-size="11" font-weight="700" fill="hsl(38 72% 78%)">ROBOTS</text>
  <!-- robot arm glyph -->
  <g stroke="hsl(38 72% 78%)" stroke-width="4" fill="none" stroke-linecap="round">
    <rect x="686" y="356" width="46" height="12" rx="4" fill="hsl(38 25% 16%)" stroke-width="2.6"/>
    <line x1="709" y1="356" x2="694" y2="312"/>
    <line x1="694" y1="312" x2="716" y2="286"/>
    <path d="M716 286 l14 -8 M716 286 l16 4"/>
  </g>
  <circle cx="709" cy="356" r="6" fill="hsl(38 72% 78%)"/>
  <circle cx="694" cy="312" r="5.4" fill="hsl(38 72% 78%)"/>
  <circle cx="716" cy="286" r="4.6" fill="hsl(38 72% 78%)"/>
  <g transform="translate(628,378)"><use xlink:href="#w4" color="hsl(38 72% 78%)"/></g>

  <text x="500" y="440" text-anchor="middle" font-size="14" fill="hsl(35 12% 64%)" letter-spacing="1">REAL PROJECTS · REAL COMMITS · REAL GREASE</text>

  <text x="500" y="510" text-anchor="middle" font-size="16" fill="hsl(35 12% 64%)">This store funds open work — we build agents, robots, and tools in the open, wearing our own merch.</text>
</svg>
