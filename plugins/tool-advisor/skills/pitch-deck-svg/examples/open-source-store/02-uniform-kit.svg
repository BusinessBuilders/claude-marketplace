<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 560" width="1000" height="560">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&amp;family=Funnel+Display:wght@300..800&amp;display=swap');
    text{font-family:'Bricolage Grotesque','Inter',system-ui,sans-serif;}
    .disp{font-family:'Funnel Display','Bricolage Grotesque',sans-serif;font-weight:800;}
  </style>
  <defs>
    <radialGradient id="vig2" cx="50%" cy="30%" r="90%">
      <stop offset="0" stop-color="hsl(30 12% 11%)"/><stop offset="1" stop-color="hsl(0 0% 4%)"/>
    </radialGradient>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1000" height="560" fill="url(#vig2)"/>
  <text x="500" y="88" text-anchor="middle" font-size="14" font-weight="600" letter-spacing="4" fill="hsl(18 67% 50%)">ONE KIT&#160;&#160;/&#160;&#160;HEAD TO HOODIE</text>
  <text x="500" y="150" text-anchor="middle" class="disp" font-size="54" letter-spacing="-1.5" fill="hsl(38 75% 97%)">THE OPEN SOURCE UNIFORM</text>

  <!-- TEE card -->
  <g filter="url(#soft2)">
    <rect x="80" y="200" width="256" height="260" rx="12" fill="hsl(30 9% 12.5%)" stroke="hsl(196 57% 44% / .5)"/>
    <rect x="80" y="200" width="256" height="6" rx="3" fill="hsl(196 57% 44%)"/>
  </g>
  <!-- tee glyph -->
  <g transform="translate(208,330)">
    <path d="M-42 -62 L-20 -74 Q0 -62 20 -74 L42 -62 L62 -34 L38 -20 L38 62 L-38 62 L-38 -20 L-62 -34 Z"
          fill="hsl(196 40% 14%)" stroke="hsl(196 52% 56%)" stroke-width="3" stroke-linejoin="round"/>
    <text y="6" text-anchor="middle" font-size="12" font-weight="700" fill="hsl(38 75% 97%)">OPEN SOURCE</text>
    <text y="24" text-anchor="middle" font-size="12" font-weight="700" fill="hsl(20 75% 62%)">MUST WIN</text>
  </g>
  <text x="208" y="496" text-anchor="middle" font-size="17" font-weight="700" fill="hsl(38 75% 97%)">THE TEE</text>

  <!-- HOODIE card -->
  <g filter="url(#soft2)">
    <rect x="372" y="200" width="256" height="260" rx="12" fill="hsl(30 9% 12.5%)" stroke="hsl(18 67% 50% / .5)"/>
    <rect x="372" y="200" width="256" height="6" rx="3" fill="hsl(18 67% 50%)"/>
  </g>
  <!-- hoodie glyph -->
  <g transform="translate(500,330)">
    <path d="M-40 -58 L-18 -74 Q0 -60 18 -74 L40 -58 L58 -30 L36 -18 L36 62 L-36 62 L-36 -18 L-58 -30 Z"
          fill="hsl(18 40% 14%)" stroke="hsl(20 75% 62%)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-20 -70 Q0 -40 20 -70 Q0 -56 -20 -70 Z" fill="hsl(18 30% 10%)" stroke="hsl(20 75% 62%)" stroke-width="2.4"/>
    <path d="M-8 -46 v18 M8 -46 v18" stroke="hsl(20 75% 62%)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <rect x="-26" y="34" width="52" height="20" rx="4" fill="hsl(18 30% 10%)" stroke="hsl(20 75% 62%)" stroke-width="2"/>
    <text y="14" text-anchor="middle" font-size="12" font-weight="700" fill="hsl(38 75% 97%)">OPEN SOURCE</text>
  </g>
  <text x="500" y="496" text-anchor="middle" font-size="17" font-weight="700" fill="hsl(38 75% 97%)">THE HOODIE</text>

  <!-- CAP card -->
  <g filter="url(#soft2)">
    <rect x="664" y="200" width="256" height="260" rx="12" fill="hsl(30 9% 12.5%)" stroke="hsl(38 72% 78% / .5)"/>
    <rect x="664" y="200" width="256" height="6" rx="3" fill="hsl(38 72% 78%)"/>
  </g>
  <!-- dad cap glyph -->
  <g transform="translate(792,336)">
    <path d="M-52 8 Q-52 -50 0 -50 Q52 -50 52 8 Z" fill="hsl(38 30% 14%)" stroke="hsl(38 72% 78%)" stroke-width="3"/>
    <path d="M-52 8 Q0 24 52 8 L74 14 Q76 26 62 26 Q0 40 -52 16 Z" fill="hsl(38 24% 10%)" stroke="hsl(38 72% 78%)" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M0 -50 Q4 -30 2 -6" stroke="hsl(38 72% 78% / .5)" stroke-width="2" fill="none"/>
    <text x="0" y="-12" text-anchor="middle" font-size="9" font-weight="700" letter-spacing=".5" fill="hsl(38 75% 97%)">OPEN SOURCE</text>
  </g>
  <text x="792" y="496" text-anchor="middle" font-size="17" font-weight="700" fill="hsl(38 75% 97%)">THE CAP · EMBROIDERED</text>

  <!-- plus signs between cards -->
  <g stroke="hsl(35 12% 64%)" stroke-width="3.6" stroke-linecap="round">
    <line x1="354" y1="322" x2="354" y2="346"/><line x1="342" y1="334" x2="366" y2="334"/>
    <line x1="646" y1="322" x2="646" y2="346"/><line x1="634" y1="334" x2="658" y2="334"/>
  </g>
  <text x="500" y="540" text-anchor="middle" font-size="15" fill="hsl(35 12% 64%)">Ship the whole kit — or start with the piece you'll wear tomorrow.</text>
</svg>
